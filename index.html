<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudySide</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff;color:#27324a}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;background:#fff}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #edf0f7;position:sticky;top:0;background:#fff;z-index:5}.iconbtn{width:44px;height:44px;border-radius:14px;background:linear-gradient(110deg,#d9ecff,#e4dcff);color:#3f4c75;font-size:22px;box-shadow:0 2px 8px #9ba8c522}.title{font-weight:750;letter-spacing:-.4px;font-size:20px}.profileArea{display:flex;align-items:center;gap:7px}.profilePic{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid #e1e5ef;background:#f2f5fa;display:block}.main{max-width:760px;margin:auto;padding:22px 16px 32px}.welcome{margin:8px 0 18px}.welcome h1{font-size:27px;margin:0 0 6px}.welcome p{margin:0;color:#7b8498}.chat{border:1px solid #e7eaf2;border-radius:22px;box-shadow:0 5px 20px #8d9bb51c;overflow:hidden;background:#fff}.messages{min-height:260px;max-height:48vh;overflow:auto;padding:18px}.msg{max-width:86%;padding:12px 14px;border-radius:16px;margin:8px 0;line-height:1.45;white-space:pre-wrap}.ai{background:#f3f5fb}.me{margin-left:auto;background:linear-gradient(110deg,#e3f1ff,#e9e2ff)}.empty{color:#8790a4;text-align:center;padding:46px 15px}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #edf0f5}.composer input{min-width:0;flex:1;border:1px solid #e1e5ef;border-radius:14px;padding:12px 13px;outline:none}.small{width:44px}.send{width:48px}.gradient{background:linear-gradient(110deg,#d9ecff,#e4dcff);color:#38466f}.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 16px}.chip{padding:9px 12px;border-radius:12px;background:#f5f7fc;color:#53607c;border:1px solid #e9ecf4}.drawer{position:fixed;inset:0;z-index:20;background:#0004;display:none}.drawer.open{display:block}.panel{width:min(330px,88vw);height:100%;background:#fff;padding:18px;box-shadow:8px 0 30px #0002}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.menuitem{width:100%;text-align:left;padding:13px 14px;margin:4px 0;border-radius:13px;background:#fff;color:#36415c;border:1px solid #edf0f6}.menuitem:hover{background:linear-gradient(110deg,#f2f8ff,#f4f0ff)}.modal{position:fixed;inset:0;background:#0004;z-index:30;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.card{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 15px 50px #0003}.close{float:right;background:#f1f3f8;border-radius:10px;padding:7px 10px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#69738a;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dfe4ef;border-radius:12px}.action{padding:11px 14px;border-radius:12px;background:linear-gradient(110deg,#d9ecff,#e4dcff);color:#3d496e;margin:4px 0}.chartbox{margin-top:18px;border:1px solid #e7eaf2;border-radius:20px;padding:16px}.chartcontrols{display:flex;gap:8px;flex-wrap:wrap}.chartcontrols input{flex:1;min-width:120px;padding:10px;border:1px solid #e1e5ef;border-radius:11px}.bars{height:210px;display:flex;align-items:flex-end;gap:12px;padding:20px 8px 8px}.barwrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:100%;max-width:70px;border-radius:10px 10px 3px 3px;background:linear-gradient(180deg,#bcdfff,#bfb2f0)}.barlabel{font-size:11px;color:#69738a;text-align:center}.value{font-size:11px}.notice{font-size:13px;color:#778198;padding:8px 0}.hidden{display:none}
</style></head><body><div class="app">
<header class="top"><button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button><div class="title">StudySide</div><div class="profileArea"><img id="headerProfilePic" class="profilePic" alt="Profile picture" onerror="this.onerror=null;this.src=defaultPic"><button class="iconbtn" id="profileBtn" aria-label="Profile">👤</button></div></header>
<main class="main"><section class="welcome"><h1>Ask anything.</h1><p>Your study helper, right here.</p></section>
<section class="chat"><div class="messages" id="messages"><div class="empty" id="empty">Ask a question to get started.</div></div><div class="chips"><button class="chip" data-q="Explain this simply">Explain</button><button class="chip" data-q="Quiz me on fractions">Quiz me</button><button class="chip" data-q="Help me with my homework">Homework help</button></div><div class="composer"><button class="iconbtn small" id="photoBtn" title="Photo">📎</button><input id="chatInput" placeholder="Ask anything…" autocomplete="off"><button class="iconbtn send" id="sendBtn">➤</button><input id="fileInput" type="file" accept="image/*" hidden></div></section>
<div class="chartbox"><h2 style="margin:0 0 5px;font-size:18px">Charts & visuals</h2><div class="notice">Enter your own data and the preview updates exactly.</div><div class="chartcontrols"><input id="chartTitle" value="My Study Subjects" aria-label="Chart title"><select id="chartType"><option value="bar">Bar</option><option value="line">Line</option><option value="pie">Pie</option></select></div><div class="chartcontrols" style="margin-top:8px"><input id="labels" value="Math,Science,English,History,Spanish" placeholder="Subjects: Math,Science,English,History,Spanish"><input id="values" value="4,3,2,2,3" placeholder="Study hours: 4,3,2,2,3"></div><div id="chartPreview"></div><button class="action" id="downloadChart">Save chart image</button></div>
</main></div>
<div class="drawer" id="drawer"><aside class="panel"><div class="panelhead"><b>StudySide</b><button class="close" id="closeDrawer">×</button></div><button class="menuitem" data-action="new">🆕 New Chat</button><button class="menuitem" data-action="history">🕘 Chat History</button><button class="menuitem" data-action="subjects">📚 Subjects</button><button class="menuitem" data-action="explain">🎚️ Explain Like…</button><button class="menuitem" data-action="settings">⚙️ Settings</button><button class="menuitem" data-action="offline">📴 Offline Study Library</button></aside></div>
<div class="modal" id="modal"><div class="card"><button class="close" id="closeModal">×</button><h2 id="modalTitle">StudySide</h2><div id="modalBody"></div></div></div>
<script>
const $=id=>document.getElementById(id), messages=$('messages');let history=[];
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('open')}
function addMsg(text,who='ai'){const e=document.createElement('div');e.className='msg '+(who==='me'?'me':'ai');e.textContent=text;messages.appendChild(e);$('empty')?.remove();messages.scrollTop=messages.scrollHeight}
function answer(q){const s=q.toLowerCase();if(s.includes('fraction'))return 'Fractions show parts of a whole. For example, 3/4 means 3 equal parts out of 4. If you give me a fraction problem, I can work through the steps.';if(s.includes('photosynthesis'))return 'Photosynthesis is how plants use light energy to make sugars from water and carbon dioxide, releasing oxygen.';if(s.includes('homework'))return 'Send me the question or a photo of it, and I can explain the steps clearly.';if(s.includes('hello')||s.includes('hi'))return 'Hi! What are you studying?';return 'I can help with that. In this prototype, try asking about fractions, photosynthesis, or homework. A full AI connection can be added separately.'}
function send(q){q=(q??$('chatInput').value).trim();if(!q)return;addMsg(q,'me');history.push(q);$('chatInput').value='';setTimeout(()=>addMsg(answer(q)),120)}
$('sendBtn').onclick=()=>send();$('chatInput').onkeydown=e=>{if(e.key==='Enter')send()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));$('photoBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{if(e.target.files[0])addMsg('Photo selected: '+e.target.files[0].name,'me'),setTimeout(()=>addMsg('I can see that a study image was selected. In the full AI version, I can analyze notes, worksheets, diagrams, or handwriting.'),120)};
$('menuBtn').onclick=()=>$('drawer').classList.add('open');$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('open')};
const defaultPic='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dceeff"/><stop offset="1" stop-color="#e9e1ff"/></linearGradient></defs><circle cx="48" cy="48" r="47" fill="url(#g)"/><circle cx="48" cy="38" r="17" fill="#7b78a8"/><path d="M20 84c4-20 18-28 28-28s24 8 28 28" fill="#7b78a8"/></svg>');
const translations={
 English:{ask:'Ask anything.',sub:'Your study helper, right here.',empty:'Ask a question to get started.',placeholder:'Ask anything…',explain:'Explain',quiz:'Quiz me',homework:'Homework help',charts:'Charts & visuals',chartNotice:'Enter your own data and the preview updates exactly.',profile:'Profile',profilePic:'Profile picture',editPic:'Edit profile picture',name:'Name',username:'StudySide username',language:'Language',grade:'School level / Grade',save:'Save profile',menu:'Menu',close:'Close',newChat:'New Chat',history:'Chat History',subjects:'Subjects',explainLike:'Explain Like…',settings:'Settings',offline:'Offline Study Library'},
 Español:{ask:'Pregunta lo que quieras.',sub:'Tu asistente de estudio, aquí mismo.',empty:'Haz una pregunta para empezar.',placeholder:'Pregunta lo que quieras…',explain:'Explicar',quiz:'Hazme un quiz',homework:'Ayuda con los deberes',charts:'Gráficos y visuales',chartNotice:'Introduce tus datos y la vista previa se actualizará exactamente.',profile:'Perfil',profilePic:'Foto de perfil',editPic:'Editar foto de perfil',name:'Nombre',username:'Usuario de StudySide',language:'Idioma',grade:'Curso / grado',save:'Guardar perfil',menu:'Menú',close:'Cerrar',newChat:'Nuevo chat',history:'Historial de chats',subjects:'Materias',explainLike:'Explicar como…',settings:'Ajustes',offline:'Biblioteca de estudio sin conexión'},
 Svenska:{ask:'Fråga vad som helst.',sub:'Din studiehjälp, precis här.',empty:'Ställ en fråga för att börja.',placeholder:'Fråga vad som helst…',explain:'Förklara',quiz:'Förhör mig',homework:'Hjälp med läxan',charts:'Diagram och visuellt',chartNotice:'Skriv in dina egna data så uppdateras förhandsvisningen exakt.',profile:'Profil',profilePic:'Profilbild',editPic:'Redigera profilbild',name:'Namn',username:'StudySide-användarnamn',language:'Språk',grade:'Skolnivå / Årskurs',save:'Spara profil',menu:'Meny',close:'Stäng',newChat:'Ny chatt',history:'Chatthistorik',subjects:'Ämnen',explainLike:'Förklara som…',settings:'Inställningar',offline:'Offline-studiebibliotek'},
 Українська:{ask:'Запитуй що завгодно.',sub:'Твій помічник для навчання, прямо тут.',empty:'Постав запитання, щоб почати.',placeholder:'Запитай що завгодно…',explain:'Пояснити',quiz:'Перевір мене',homework:'Допомога з домашнім',charts:'Графіки та візуалізації',chartNotice:'Введи власні дані — попередній перегляд оновиться точно.',profile:'Профіль',profilePic:'Фото профілю',editPic:'Змінити фото профілю',name:'Ім’я',username:'Ім’я користувача StudySide',language:'Мова',grade:'Шкільний рівень / Клас',save:'Зберегти профіль',menu:'Меню',close:'Закрити',newChat:'Новий чат',history:'Історія чатів',subjects:'Предмети',explainLike:'Поясни як…',settings:'Налаштування',offline:'Офлайн-бібліотека для навчання'}
};
function currentLang(){return (JSON.parse(localStorage.getItem('studysideProfile')||'{}').language)||'English'}
function t(k){return (translations[currentLang()]||translations.English)[k]||translations.English[k]||k}
function applyLanguage(){const l=currentLang();document.documentElement.lang=l==='Español'?'es':l==='Svenska'?'sv':l==='Українська'?'uk':'en';$('profileBtn').setAttribute('aria-label',t('profile'));$('menuBtn').setAttribute('aria-label',t('menu'));$('closeDrawer').setAttribute('aria-label',t('close'));document.querySelector('.welcome h1').textContent=t('ask');document.querySelector('.welcome p').textContent=t('sub');$('empty')?.replaceChildren(document.createTextNode(t('empty')));$('chatInput').placeholder=t('placeholder');document.querySelector('[data-q="Explain this simply"]').textContent=t('explain');document.querySelector('[data-q="Quiz me on fractions"]').textContent=t('quiz');document.querySelector('[data-q="Help me with my homework"]').textContent=t('homework');document.querySelector('.chartbox h2').textContent=t('charts');document.querySelector('.chartbox .notice').textContent=t('chartNotice');const items=document.querySelectorAll('.menuitem');if(items.length>=6){items[0].textContent='🆕 '+t('newChat');items[1].textContent='🕘 '+t('history');items[2].textContent='📚 '+t('subjects');items[3].textContent='🎚️ '+t('explainLike');items[4].textContent='⚙️ '+t('settings');items[5].textContent='📴 '+t('offline')}}
function loadProfile(){const p=JSON.parse(localStorage.getItem('studysideProfile')||'{}');$('headerProfilePic').src=p.picture||defaultPic;applyLanguage()}
function profileModal(){const p=JSON.parse(localStorage.getItem('studysideProfile')||'{}');openModal(t('profile'),`<div class="field"><label>${t('profilePic')}</label><div style="display:flex;align-items:center;gap:12px"><img id="profilePreview" class="profilePic" style="width:58px;height:58px" src="${p.picture||defaultPic}" alt="${t('profilePic')}"><button class="action" id="choosePic">🖼️ ${t('editPic')}</button><input id="profileFile" type="file" accept="image/*" hidden></div></div><div class="field"><label>${t('name')}</label><input id="pname" placeholder="${t('username')}" value="${(p.name||'').replaceAll('"','&quot;')}"></div><div class="field"><label>${t('language')}</label><select id="plang"><option value="English">English</option><option value="Español">Español</option><option value="Svenska">Svenska</option><option value="Українська">Українська</option></select></div><div class="field"><label>${t('grade')}</label><select id="pgrade"><option>5th grade</option><option>6th grade</option><option>7th grade</option><option>8th grade</option><option>Other</option></select></div><button class="action" id="saveProfile">${t('save')}</button>`);$('plang').value=p.language||'English';$('pgrade').value=p.grade||'5th grade';let pic=p.picture||defaultPic;
$('choosePic').onclick=()=>$('profileFile').click();
$('profileFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const size=256;const scale=Math.min(size/img.width,size/img.height,1);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pic=c.toDataURL('image/jpeg',0.82);$('profilePreview').src=pic;$('headerProfilePic').src=pic};img.src=r.result};r.readAsDataURL(f)};
$('plang').onchange=()=>{const selected=$('plang').value;const old=JSON.parse(localStorage.getItem('studysideProfile')||'{}');old.language=selected;localStorage.setItem('studysideProfile',JSON.stringify(old));applyLanguage()};
$('saveProfile').onclick=()=>{try{localStorage.setItem('studysideProfile',JSON.stringify({name:$('pname').value.trim(),language:$('plang').value,grade:$('pgrade').value,picture:pic}));loadProfile();$('modal').classList.remove('open')}catch(e){alert('The picture is too large. Please choose a smaller picture.')}};}
$('profileBtn').onclick=profileModal;loadProfile();
$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('drawer').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;$('drawer').classList.remove('open');if(a==='new'){messages.innerHTML='<div class="empty" id="empty">Ask a question to get started.</div>';history=[]}else if(a==='history')openModal('Chat History',history.length?history.map(x=>'<p>'+x.replaceAll('<','&lt;')+'</p>').join(''):'<p>No chats yet.</p>');else if(a==='subjects')openModal('Subjects','<button class="action">📚 School</button><button class="action">✍️ Grammar & Writing</button><button class="action">🌎 Language Learning</button><button class="action">🔬 Science & Medicine</button><button class="action">🌌 Explore</button><button class="action">💼 Careers</button>');else if(a==='explain')openModal('Explain Like…','<button class="action" onclick="send(\'Explain this simply\');document.getElementById(\'modal\').classList.remove(\'open\')">Simple</button><button class="action" onclick="send(\'Explain this like I am new to it\');document.getElementById(\'modal\').classList.remove(\'open\')">Like I’m new</button><button class="action" onclick="send(\'Explain this with an example\');document.getElementById(\'modal\').classList.remove(\'open\')">With an example</button><button class="action" onclick="send(\'Give me a more detailed explanation\');document.getElementById(\'modal\').classList.remove(\'open\')">More detailed</button>');else if(a==='settings')openModal('Settings','<p>StudySide is designed to stay simple and personal.</p><button class="action" onclick="alert(\'Settings saved.\')">Save settings</button>');else openModal('Offline Study Library','<p>Saved study materials can be stored here for offline access. A true offline AI model still needs to be installed in the app.')});
function renderChart(){let labs=$('labels').value.split(',').map(x=>x.trim()).filter(Boolean),vals=$('values').value.split(',').map(x=>Number(x.trim())).filter(x=>Number.isFinite(x));let n=Math.min(labs.length,vals.length);labs=labs.slice(0,n);vals=vals.slice(0,n);let max=Math.max(...vals,1),type=$('chartType').value,title=$('chartTitle').value||'My Study Subjects',out='<h3 style="margin:16px 0 8px">'+title.replaceAll('<','&lt;')+'</h3>';if(!n){$('chartPreview').innerHTML=out+'<div class="notice">Enter matching subjects and numbers.</div>';return}if(type==='bar'){out+='<div class="bars">';for(let i=0;i<n;i++)out+='<div class="barwrap"><div class="value">'+vals[i]+'</div><div class="bar" style="height:'+Math.max(3,vals[i]/max*160)+'px"></div><div class="barlabel">'+labs[i].replaceAll('<','&lt;')+'</div></div>';out+='</div>'}else if(type==='pie'){let total=vals.reduce((a,b)=>a+b,0),acc=0;let stops=vals.map((v,i)=>{let a=acc/total*360;acc+=v;let b=acc/total*360;return `hsl(${210+i*35},70%,82%) ${a}deg ${b}deg`}).join(',');out+=`<div style="width:190px;height:190px;border-radius:50%;margin:20px auto;background:conic-gradient(${stops})"></div>`;out+='<div class="notice" style="text-align:center">'+labs.map((l,i)=>l+': '+vals[i]+' h').join(' · ')+'</div>'}else{let pts=vals.map((v,i)=>{let x=n===1?50:i/(n-1)*100,y=100-v/max*80;return `${x},${y}`}).join(' ');out+=`<svg viewBox="0 0 100 100" style="width:100%;height:220px"><polyline points="${pts}" fill="none" stroke="#8b84c8" stroke-width="1.5"/>${vals.map((v,i)=>{let x=n===1?50:i/(n-1)*100,y=100-v/max*80;return `<circle cx="${x}" cy="${y}" r="2" fill="#8b84c8"/>`}).join('')}</svg><div class="notice">`+labs.map((l,i)=>l+': '+vals[i]+' h').join(' · ')+'</div>'}$('chartPreview').innerHTML=out}
function downloadChart(){let labs=$('labels').value.split(',').map(x=>x.trim()).filter(Boolean),vals=$('values').value.split(',').map(x=>Number(x.trim())).filter(x=>Number.isFinite(x));let n=Math.min(labs.length,vals.length);if(!n)return;let c=document.createElement('canvas'),w=1000,h=650;c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#27324a';ctx.font='bold 30px Arial';ctx.fillText($('chartTitle').value||'My Study Subjects',50,55);ctx.font='16px Arial';ctx.fillStyle='#69738a';ctx.fillText('Study hours by subject',50,85);let type=$('chartType').value,max=Math.max(...vals,1);if(type==='bar'){let bw=Math.min(100,(w-120)/n-20),base=520;for(let i=0;i<n;i++){let bh=380*vals[i]/max,x=60+i*((w-120)/n)+20;ctx.fillStyle=['#bcdfff','#c9bdf2','#c9e5d2','#f1df9b','#f0c8d8','#c6d0ee'][i%6];ctx.fillRect(x,base-bh,bw,bh);ctx.fillStyle='#27324a';ctx.font='16px Arial';ctx.fillText(String(vals[i])+' h',x,base-bh-10);ctx.fillText(labs[i],x,550)}}else if(type==='pie'){let total=vals.reduce((a,b)=>a+b,0),a=-Math.PI/2;let cx=350,cy=330,r=210;for(let i=0;i<n;i++){let b=a+vals[i]/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,b);ctx.closePath();ctx.fillStyle=['#bcdfff','#c9bdf2','#c9e5d2','#f1df9b','#f0c8d8','#c6d0ee'][i%6];ctx.fill();a=b}ctx.font='17px Arial';for(let i=0;i<n;i++){ctx.fillStyle='#27324a';ctx.fillText(labs[i]+': '+vals[i]+' h',610,170+i*45)}}else{let left=70,right=900,base=520,top=130;ctx.strokeStyle='#8b84c8';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<n;i++){let x=n===1?(left+right)/2:left+i*(right-left)/(n-1),y=base-390*vals[i]/max;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();for(let i=0;i<n;i++){let x=n===1?(left+right)/2:left+i*(right-left)/(n-1),y=base-390*vals[i]/max;ctx.fillStyle='#8b84c8';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#27324a';ctx.font='15px Arial';ctx.fillText(labs[i],x-25,550)}}let a=document.createElement('a');a.download='studyside-subject-chart.png';a.href=c.toDataURL('image/png');a.click()}
$('downloadChart').onclick=downloadChart;
['chartTitle','labels','values','chartType'].forEach(id=>$(id).addEventListener('input',renderChart));renderChart();
</script></body></html>
